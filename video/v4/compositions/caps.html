    <div class="cap clip" id="cap28-1" data-start="75.720" data-duration="1.1" data-track-index="1" style="top:1329px"><b class="k" id="cap28-1-w0">millequattrocento</b> a</div>
    <div class="cap clip" id="cap28-2" data-start="76.780" data-duration="0.84" data-track-index="1" style="top:1329px"><b class="k" id="cap28-2-w0">tremila</b> <b class="k" id="cap28-2-w1">euro.</b></div>
    <div class="cap clip" id="cap29-0" data-start="77.620" data-duration="1.86" data-track-index="1" style="top:1329px"><b class="k" id="cap29-0-w0">Netti,</b> al mese.</div>
    <div class="cap clip" id="cap30-0" data-start="79.480" data-duration="1.76" data-track-index="1" style="top:1329px"><b class="k" id="cap30-0-w0">Gasolio,</b> <b class="k" id="cap30-0-w1">assicurazione</b> e</div>
    <div class="cap clip" id="cap30-1" data-start="81.200" data-duration="0.76" data-track-index="1" style="top:1329px"><b class="k" id="cap30-1-w0">rate</b> le paghi tu.</div>
    <div class="cap clip" id="cap31-0" data-start="81.960" data-duration="2.16" data-track-index="1" style="top:1329px">E se il camion si ferma,</div>
    <div class="cap clip" id="cap31-1" data-start="84.080" data-duration="0.58" data-track-index="1" style="top:1329px"><b class="k" id="cap31-1-w0">ti</b> <b class="k" id="cap31-1-w1">fermi</b> <b class="k" id="cap31-1-w2">tu.</b></div>
    <div class="cap clip" id="cap32-0" data-start="84.660" data-duration="1.54" data-track-index="1" style="top:1329px">La strada ti ha dato un</div>
    <div class="cap clip" id="cap32-1" data-start="86.160" data-duration="0.74" data-track-index="1" style="top:1329px"><b class="k" id="cap32-1-w0">lavoro</b> <b class="k" id="cap32-1-w1">sicuro.</b></div>
    <div class="cap clip" id="cap33-0" data-start="86.900" data-duration="1.4" data-track-index="1" style="top:1329px">E in cambio,</div>
    <div class="cap clip" id="cap33-1" data-start="88.260" data-duration="0.84" data-track-index="1" style="top:1329px">ti ha preso <b class="k" id="cap33-1-w3">gli</b> <b class="k" id="cap33-1-w4">anni.</b></div>
    <div class="cap clip" id="cap34-0" data-start="89.100" data-duration="1.74" data-track-index="1" style="top:1329px">Hai <b class="k" id="cap34-0-w1">ventitré</b> anni.</div>
    <div class="cap clip" id="cap34-1" data-start="90.800" data-duration="0.76" data-track-index="1" style="top:1329px">Un camion.</div>
    <div class="cap clip" id="cap34-2" data-start="91.520" data-duration="0.6" data-track-index="1" style="top:1329px">Una strada.</div>
    <div class="cap clip" id="cap35-0" data-start="92.120" data-duration="0.92" data-track-index="1" style="top:1329px">A <b class="k" id="cap35-0-w1">trentotto,</b></div>
    <div class="cap clip" id="cap35-1" data-start="93.000" data-duration="1.68" data-track-index="1" style="top:1329px">la strada è ancora lì.</div>
    <div class="cap clip" id="cap36-0" data-start="94.680" data-duration="1.44" data-track-index="1" style="top:1329px">Tu, un po' <b class="k" id="cap36-0-w3">meno.</b></div>
