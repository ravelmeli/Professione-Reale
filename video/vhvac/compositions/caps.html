    <div class="cap clip" id="cap31-0" data-start="97.300" data-duration="0.74" data-track-index="1" style="top:924px">Dopo qualche anno,</div>

    <div class="cap clip" id="cap32-0" data-start="100.000" data-duration="1.82" data-track-index="1" style="top:924px">Monti l'unità <b class="k" id="cap32-0-w2">interna</b> e tiri le linee,</div>

    <div class="cap clip" id="cap33-2" data-start="106.400" data-duration="1.66" data-track-index="1" style="top:924px">collegamento perfetto.</div>
    <div class="cap clip" id="cap34-0" data-start="108.060" data-duration="0.9" data-track-index="1" style="top:924px">Poi fai il <b class="k" id="cap34-0-w3">vuoto,</b></div>
    <div class="cap clip" id="cap34-1" data-start="108.920" data-duration="0.76" data-track-index="1" style="top:924px">con una pompa,</div>

    <div class="cap clip" id="cap35-0" data-start="111.880" data-duration="2.1" data-track-index="1" style="top:924px">Un cantiere lo capisci dal ritmo: il tuo</div>

    <div class="cap clip" id="cap36-0" data-start="116.440" data-duration="1.4" data-track-index="1" style="top:924px">Il <b class="k" id="cap36-0-w1">minimo</b> del contratto,</div>
    <div class="cap clip" id="cap36-1" data-start="117.800" data-duration="1.82" data-track-index="1" style="top:924px">dal primo marzo duemilaventisei,</div>
    <div class="cap clip" id="cap36-2" data-start="119.580" data-duration="2.1" data-track-index="1" style="top:924px">è circa <b class="k" id="cap36-2-w2">milleseicentocinquanta</b> euro</div>
    <div class="cap clip" id="cap36-3" data-start="121.640" data-duration="1.37" data-track-index="1" style="top:924px">lordi al mese.</div>
    <div class="cap clip" id="cap37-0" data-start="123.010" data-duration="2.57" data-track-index="1" style="top:924px"><b class="k" id="cap37-0-w0">Lordi</b> vuol dire prima delle <b class="k" id="cap37-0-w5">tasse,</b></div>
    <div class="cap clip" id="cap37-1" data-start="125.540" data-duration="2.02" data-track-index="1" style="top:924px">per tredici mensilità.</div>
    <div class="cap clip" id="cap38-0" data-start="127.560" data-duration="2.08" data-track-index="1" style="top:924px">Scatti di anzianità e superminimi si</div>
    <div class="cap clip" id="cap38-1" data-start="129.600" data-duration="0.94" data-track-index="1" style="top:924px">aggiungono.</div>
    <div class="cap clip" id="cap39-0" data-start="130.540" data-duration="1.7" data-track-index="1" style="top:924px">Ma quel numero è un <b class="k" id="cap39-0-w5">minimo,</b></div>
    <div class="cap clip" id="cap39-1" data-start="132.200" data-duration="2.16" data-track-index="1" style="top:924px">non quello che leggi in busta paga.</div>
    <div class="cap clip" id="cap40-0" data-start="134.360" data-duration="1.96" data-track-index="1" style="top:924px">E il tuo capo ti ripete sempre la stessa</div>
    <div class="cap clip" id="cap40-1" data-start="136.280" data-duration="0.96" data-track-index="1" style="top:924px">frase.</div>
    <div class="cap clip" id="cap41-0" data-start="137.240" data-duration="1.44" data-track-index="1" style="top:924px">Se non sei certificato,</div>
    <div class="cap clip" id="cap41-1" data-start="138.640" data-duration="1.43" data-track-index="1" style="top:924px">non puoi toccare il <b class="k" id="cap41-1-w4">gas.</b></div>
    <div class="cap clip" id="cap42-0" data-start="140.070" data-duration="1.49" data-track-index="1" style="top:924px"><b class="k" id="cap42-0-w0">Livello</b> tre.</div>
    <div class="cap clip" id="cap42-1" data-start="141.520" data-duration="2.16" data-track-index="1" style="top:924px">Il <b class="k" id="cap42-1-w1">patentino</b> F-gas.</div>
    <div class="cap clip" id="cap43-0" data-start="143.680" data-duration="2.14" data-track-index="1" style="top:924px">Il suo nome ufficiale è <b class="k" id="cap43-0-w5">certificazione</b></div>
    <div class="cap clip" id="cap43-1" data-start="145.780" data-duration="1.7" data-track-index="1" style="top:924px">per i <b class="k" id="cap43-1-w2">gas</b> fluorurati.</div>
    <div class="cap clip" id="cap44-0" data-start="147.480" data-duration="1.22" data-track-index="1" style="top:924px">Serve a installare,</div>
    <div class="cap clip" id="cap44-1" data-start="148.660" data-duration="2.1" data-track-index="1" style="top:924px">riparare e smantellare impianti con</div>
    <div class="cap clip" id="cap44-2" data-start="150.720" data-duration="1.38" data-track-index="1" style="top:924px"><b class="k" id="cap44-2-w0">refrigerante.</b></div>
    <div class="cap clip" id="cap45-0" data-start="152.100" data-duration="1.38" data-track-index="1" style="top:924px">Un corso con esame costa da</div>
    <div class="cap clip" id="cap45-1" data-start="153.440" data-duration="1.44" data-track-index="1" style="top:924px"><b class="k" id="cap45-1-w0">quattrocentocinquanta</b> a</div>
    <div class="cap clip" id="cap45-2" data-start="154.840" data-duration="1.76" data-track-index="1" style="top:924px"><b class="k" id="cap45-2-w0">seicentosessantacinque</b> euro,</div>
    <div class="cap clip" id="cap45-3" data-start="156.560" data-duration="0.98" data-track-index="1" style="top:924px">più IVA.</div>
    <div class="cap clip" id="cap46-0" data-start="157.540" data-duration="1.26" data-track-index="1" style="top:924px">Poi paghi una piccola quota di</div>
    <div class="cap clip" id="cap46-1" data-start="158.760" data-duration="1.79" data-track-index="1" style="top:924px">mantenimento ogni anno.</div>
    <div class="cap clip" id="cap47-0" data-start="160.550" data-duration="2.29" data-track-index="1" style="top:924px">L'esame ha anche prove pratiche: ricerca</div>
    <div class="cap clip" id="cap47-1" data-start="162.800" data-duration="1.86" data-track-index="1" style="top:924px"><b class="k" id="cap47-1-w0">perdite,</b> recupero del <b class="k" id="cap47-1-w3">gas,</b></div>
    <div class="cap clip" id="cap47-2" data-start="164.620" data-duration="1.16" data-track-index="1" style="top:924px">saldatura.</div>
    <div class="cap clip" id="cap48-0" data-start="165.780" data-duration="2.02" data-track-index="1" style="top:924px">E ti iscrivi al <b class="k" id="cap48-0-w4">registro</b> telematico</div>

    <div class="cap clip" id="cap49-0" data-start="169.600" data-duration="1.0" data-track-index="1" style="top:924px">Da quel giorno,</div>
    <div class="cap clip" id="cap49-1" data-start="170.560" data-duration="1.38" data-track-index="1" style="top:924px">il tuo nome è in una banca dati</div>
    <div class="cap clip" id="cap49-2" data-start="171.900" data-duration="0.88" data-track-index="1" style="top:924px"><b class="k" id="cap49-2-w0">pubblica.</b></div>
    <div class="cap clip" id="cap50-0" data-start="172.780" data-duration="1.54" data-track-index="1" style="top:924px">Chiunque può controllare se sei in</div>
    <div class="cap clip" id="cap50-1" data-start="174.280" data-duration="0.98" data-track-index="1" style="top:924px">regola.</div>
    <div class="cap clip" id="cap51-0" data-start="175.260" data-duration="1.44" data-track-index="1" style="top:924px">Ora puoi fare una prova di tenuta,</div>
    <div class="cap clip" id="cap51-1" data-start="176.660" data-duration="1.76" data-track-index="1" style="top:924px">e cercare le <b class="k" id="cap51-1-w3">perdite.</b></div>
    <div class="cap clip" id="cap52-0" data-start="178.420" data-duration="0.96" data-track-index="1" style="top:924px">E se <b class="k" id="cap52-0-w2">sbagli,</b></div>
    <div class="cap clip" id="cap52-1" data-start="179.340" data-duration="1.82" data-track-index="1" style="top:924px">lo scopre qualcuno.</div>
    <div class="cap clip" id="cap53-0" data-start="181.160" data-duration="1.3" data-track-index="1" style="top:924px"><b class="k" id="cap53-0-w0">Livello</b> quattro.</div>
    <div class="cap clip" id="cap53-1" data-start="182.420" data-duration="1.8" data-track-index="1" style="top:924px">Tecnico <b class="k" id="cap53-1-w1">specializzato.</b></div>
    <div class="cap clip" id="cap54-0" data-start="184.220" data-duration="1.82" data-track-index="1" style="top:924px">Non monti più solo split.</div>
    <div class="cap clip" id="cap55-0" data-start="186.040" data-duration="1.26" data-track-index="1" style="top:924px">D'estate raffreddi,</div>

    <div class="cap clip" id="cap56-0" data-start="190.840" data-duration="1.38" data-track-index="1" style="top:924px">Lavori su <b class="k" id="cap56-0-w2">pompe</b> di <b class="k" id="cap56-0-w4">calore,</b></div>
    <div class="cap clip" id="cap56-1" data-start="192.180" data-duration="2.3" data-track-index="1" style="top:924px">impianti più grandi e interventi dopo un</div>
    <div class="cap clip" id="cap56-2" data-start="194.440" data-duration="0.98" data-track-index="1" style="top:924px">guasto.</div>
    <div class="cap clip" id="cap57-0" data-start="195.420" data-duration="1.7" data-track-index="1" style="top:924px">Cerchi una perdita <b class="k" id="cap57-0-w3">invisibile,</b></div>

    <div class="cap clip" id="cap58-0" data-start="199.480" data-duration="2.42" data-track-index="1" style="top:924px">Ogni intervento sul <b class="k" id="cap58-0-w3">gas</b> va documentato,</div>
    <div class="cap clip" id="cap58-1" data-start="201.860" data-duration="2.16" data-track-index="1" style="top:924px">sul <b class="k" id="cap58-1-w1">registro</b> dell'impianto.</div>
    <div class="cap clip" id="cap59-0" data-start="204.020" data-duration="2.06" data-track-index="1" style="top:924px">Il <b class="k" id="cap59-0-w1">minimo</b> del contratto sale: circa</div>
    <div class="cap clip" id="cap59-1" data-start="206.040" data-duration="2.4" data-track-index="1" style="top:924px"><b class="k" id="cap59-1-w0">millesettecentocinquanta</b> euro lordi.</div>
    <div class="cap clip" id="cap60-0" data-start="208.440" data-duration="2.04" data-track-index="1" style="top:924px">Perché ora guidi e controlli i lavori</div>
    <div class="cap clip" id="cap60-1" data-start="210.440" data-duration="1.38" data-track-index="1" style="top:924px">con <b class="k" id="cap60-1-w1">autonomia.</b></div>
    <div class="cap clip" id="cap61-0" data-start="211.820" data-duration="1.52" data-track-index="1" style="top:924px">Ma quando fa <b class="k" id="cap61-0-w3">caldo,</b></div>
    <div class="cap clip" id="cap61-1" data-start="213.300" data-duration="2.24" data-track-index="1" style="top:924px">il <b class="k" id="cap61-1-w1">telefono</b> non smette di suonare.</div>

    <div class="cap clip" id="cap63-2" data-start="221.800" data-duration="1.68" data-track-index="1" style="top:924px">anche sotto il sole.</div>
    <div class="cap clip" id="cap64-0" data-start="223.480" data-duration="1.18" data-track-index="1" style="top:924px">Se ti sta piacendo,</div>
    <div class="cap clip" id="cap64-1" data-start="224.620" data-duration="2.1" data-track-index="1" style="top:924px"><b class="k" id="cap64-1-w0">iscriviti:</b> mancano i due livelli più</div>

    <div class="cap clip" id="cap65-0" data-start="227.940" data-duration="1.42" data-track-index="1" style="top:924px"><b class="k" id="cap65-0-w0">Livello</b> cinque.</div>
    <div class="cap clip" id="cap65-1" data-start="229.320" data-duration="1.76" data-track-index="1" style="top:924px">Responsabile tecnico.</div>
    <div class="cap clip" id="cap66-0" data-start="231.080" data-duration="2.24" data-track-index="1" style="top:924px">Qui il lavoro cambia: non basta più</div>
    <div class="cap clip" id="cap66-1" data-start="233.280" data-duration="1.18" data-track-index="1" style="top:924px">saper fare.</div>
    <div class="cap clip" id="cap67-0" data-start="234.460" data-duration="1.78" data-track-index="1" style="top:924px">Servono studi tecnici e anni di</div>
    <div class="cap clip" id="cap67-1" data-start="236.200" data-duration="0.9" data-track-index="1" style="top:924px">esperienza,</div>
    <div class="cap clip" id="cap67-2" data-start="237.060" data-duration="2.24" data-track-index="1" style="top:924px">oppure un diploma e pratica.</div>
    <div class="cap clip" id="cap68-0" data-start="239.300" data-duration="2.3" data-track-index="1" style="top:924px">Qui devi poter <b class="k" id="cap68-0-w3">firmare.</b></div>
    <div class="cap clip" id="cap69-0" data-start="241.600" data-duration="1.34" data-track-index="1" style="top:924px">La legge dice che solo chi ha i</div>

    <div class="cap clip" id="cap69-2" data-start="244.740" data-duration="1.34" data-track-index="1" style="top:924px"><b class="k" id="cap69-2-w0">conformità.</b></div>
    <div class="cap clip" id="cap70-0" data-start="246.080" data-duration="1.86" data-track-index="1" style="top:924px">Quel foglio dice: questo impianto è</div>
    <div class="cap clip" id="cap70-1" data-start="247.900" data-duration="1.22" data-track-index="1" style="top:924px">fatto bene.</div>
    <div class="cap clip" id="cap71-0" data-start="249.120" data-duration="2.32" data-track-index="1" style="top:924px">La tua <b class="k" id="cap71-0-w2">firma</b> resta lì per anni.</div>
    <div class="cap clip" id="cap72-0" data-start="251.440" data-duration="1.82" data-track-index="1" style="top:924px">Ora guidi una <b class="k" id="cap72-0-w3">squadra,</b></div>
    <div class="cap clip" id="cap72-1" data-start="253.220" data-duration="2.62" data-track-index="1" style="top:924px">e rispondi anche di chi lavora con te.</div>
    <div class="cap clip" id="cap73-0" data-start="255.840" data-duration="1.64" data-track-index="1" style="top:924px">Un errore di un collega diventa un</div>
    <div class="cap clip" id="cap73-1" data-start="257.440" data-duration="1.1" data-track-index="1" style="top:924px">problema tuo.</div>
    <div class="cap clip" id="cap74-0" data-start="258.540" data-duration="2.36" data-track-index="1" style="top:924px">E devi tenere aggiornati formazione,</div>
    <div class="cap clip" id="cap74-1" data-start="260.860" data-duration="2.4" data-track-index="1" style="top:924px">certificati e registri.</div>
    <div class="cap clip" id="cap75-0" data-start="263.260" data-duration="2.36" data-track-index="1" style="top:924px">Lo scopri presto: la carta pesa quanto</div>
    <div class="cap clip" id="cap75-1" data-start="265.580" data-duration="1.32" data-track-index="1" style="top:924px">il <b class="k" id="cap75-1-w1">rame.</b></div>
    <div class="cap clip" id="cap76-0" data-start="266.900" data-duration="1.08" data-track-index="1" style="top:924px"><b class="k" id="cap76-0-w0">Livello</b> sei.</div>
    <div class="cap clip" id="cap76-1" data-start="267.940" data-duration="1.72" data-track-index="1" style="top:924px">Apri la tua <b class="k" id="cap76-1-w3">ditta.</b></div>
    <div class="cap clip" id="cap77-0" data-start="269.660" data-duration="2.0" data-track-index="1" style="top:924px">Niente più contratto: ora contano i</div>
    <div class="cap clip" id="cap77-1" data-start="271.620" data-duration="1.22" data-track-index="1" style="top:924px"><b class="k" id="cap77-1-w0">clienti.</b></div>
    <div class="cap clip" id="cap78-0" data-start="272.840" data-duration="2.28" data-track-index="1" style="top:924px">Un cliente ti giudica da una cosa sola:</div>
    <div class="cap clip" id="cap78-1" data-start="275.080" data-duration="2.0" data-track-index="1" style="top:924px">quanto è <b class="k" id="cap78-1-w2">fresca</b> la casa.</div>
    <div class="cap clip" id="cap79-0" data-start="277.080" data-duration="0.66" data-track-index="1" style="top:924px">Le tariffe,</div>
    <div class="cap clip" id="cap79-1" data-start="277.700" data-duration="0.48" data-track-index="1" style="top:924px">in media,</div>
    <div class="cap clip" id="cap79-2" data-start="278.140" data-duration="2.69" data-track-index="1" style="top:924px">vanno da <b class="k" id="cap79-2-w2">venticinque</b> a <b class="k" id="cap79-2-w4">sessanta</b> euro</div>
    <div class="cap clip" id="cap79-3" data-start="280.790" data-duration="0.43" data-track-index="1" style="top:924px">l'ora.</div>
    <div class="cap clip" id="cap80-0" data-start="281.220" data-duration="0.98" data-track-index="1" style="top:924px">Il diritto di chiamata,</div>
    <div class="cap clip" id="cap80-1" data-start="282.160" data-duration="1.9" data-track-index="1" style="top:924px">da <b class="k" id="cap80-1-w1">trenta</b> a <b class="k" id="cap80-1-w3">ottanta</b> euro.</div>
    <div class="cap clip" id="cap81-0" data-start="284.060" data-duration="0.8" data-track-index="1" style="top:924px">Sono <b class="k" id="cap81-0-w1">stime,</b></div>
    <div class="cap clip" id="cap81-1" data-start="284.820" data-duration="1.42" data-track-index="1" style="top:924px">non cifre fisse.</div>
    <div class="cap clip" id="cap82-0" data-start="286.240" data-duration="2.38" data-track-index="1" style="top:924px">Ma il <b class="k" id="cap82-0-w2">fatturato</b> non è quello che ti</div>
    <div class="cap clip" id="cap82-1" data-start="288.580" data-duration="0.98" data-track-index="1" style="top:924px">resta.</div>
    <div class="cap clip" id="cap83-0" data-start="289.560" data-duration="1.5" data-track-index="1" style="top:924px">Da lì tolgono furgone,</div>
    <div class="cap clip" id="cap83-1" data-start="291.020" data-duration="0.74" data-track-index="1" style="top:924px">attrezzi,</div>
    <div class="cap clip" id="cap83-2" data-start="291.720" data-duration="2.42" data-track-index="1" style="top:924px">assicurazione e certificazioni.</div>
    <div class="cap clip" id="cap84-0" data-start="294.140" data-duration="1.6" data-track-index="1" style="top:924px">Tolgono gli strumenti da rinnovare,</div>
    <div class="cap clip" id="cap84-1" data-start="295.700" data-duration="2.0" data-track-index="1" style="top:924px">e le ferie che non fai.</div>
    <div class="cap clip" id="cap85-0" data-start="297.700" data-duration="2.5" data-track-index="1" style="top:924px">Il <b class="k" id="cap85-0-w1">costo</b> <b class="k" id="cap85-0-w2">nascosto</b> non è in busta paga.</div>
    <div class="cap clip" id="cap86-0" data-start="300.200" data-duration="2.52" data-track-index="1" style="top:924px">È la <b class="k" id="cap86-0-w2">stagionalità</b> del mestiere.</div>
    <div class="cap clip" id="cap87-0" data-start="302.720" data-duration="2.53" data-track-index="1" style="top:924px">In <b class="k" id="cap87-0-w1">estate</b> sei il re del condominio.</div>
    <div class="cap clip" id="cap88-0" data-start="305.250" data-duration="0.65" data-track-index="1" style="top:924px">D'inverno,</div>
    <div class="cap clip" id="cap88-1" data-start="305.860" data-duration="2.4" data-track-index="1" style="top:924px">forse, resti ad aspettare.</div>
    <div class="cap clip" id="cap89-0" data-start="308.260" data-duration="2.5" data-track-index="1" style="top:924px">Guadagni tanto quando tutti hanno <b class="k" id="cap89-0-w5">caldo.</b></div>
    <div class="cap clip" id="cap90-0" data-start="310.760" data-duration="0.98" data-track-index="1" style="top:924px">Poi arriva il <b class="k" id="cap90-0-w3">freddo,</b></div>
    <div class="cap clip" id="cap90-1" data-start="311.700" data-duration="2.8" data-track-index="1" style="top:924px">e devi sopravvivere ai mesi calmi.</div>
    <div class="cap clip" id="cap91-0" data-start="314.500" data-duration="2.8" data-track-index="1" style="top:924px">E ogni intervento porta la tua <b class="k" id="cap91-0-w6">firma.</b></div>
    <div class="cap clip" id="cap92-0" data-start="317.300" data-duration="1.32" data-track-index="1" style="top:924px">Torna al <b class="k" id="cap92-0-w2">tetto,</b></div>
    <div class="cap clip" id="cap92-1" data-start="318.580" data-duration="1.18" data-track-index="1" style="top:924px">a <b class="k" id="cap92-1-w1">luglio.</b></div>
    <div class="cap clip" id="cap93-0" data-start="319.760" data-duration="1.72" data-track-index="1" style="top:924px">Il ragazzo con la chiave inglese non sa</div>
    <div class="cap clip" id="cap93-1" data-start="321.440" data-duration="1.54" data-track-index="1" style="top:924px">ancora tutto questo.</div>
    <div class="cap clip" id="cap94-0" data-start="322.980" data-duration="1.44" data-track-index="1" style="top:924px">Non sa che il suo lavoro sarà</div>
    <div class="cap clip" id="cap94-1" data-start="324.380" data-duration="1.22" data-track-index="1" style="top:924px"><b class="k" id="cap94-1-w0">invisibile.</b></div>
    <div class="cap clip" id="cap95-0" data-start="325.600" data-duration="0.8" data-track-index="1" style="top:924px">Se fa bene,</div>
    <div class="cap clip" id="cap95-1" data-start="326.360" data-duration="1.32" data-track-index="1" style="top:924px">nessuno ci pensa.</div>
    <div class="cap clip" id="cap96-0" data-start="327.680" data-duration="1.05" data-track-index="1" style="top:924px">Se sbaglia,</div>
    <div class="cap clip" id="cap96-1" data-start="328.690" data-duration="2.77" data-track-index="1" style="top:924px">un'estate intera ricorderà il suo nome.</div>
    <div class="cap clip" id="cap97-0" data-start="331.460" data-duration="1.9" data-track-index="1" style="top:924px">Dal primo <b class="k" id="cap97-0-w2">stipendio</b> da <b class="k" id="cap97-0-w4">apprendista</b> alla</div>
    <div class="cap clip" id="cap97-1" data-start="333.320" data-duration="0.52" data-track-index="1" style="top:924px">tua ditta,</div>
    <div class="cap clip" id="cap97-2" data-start="333.800" data-duration="1.76" data-track-index="1" style="top:924px">passano anni.</div>
    <div class="cap clip" id="cap98-0" data-start="335.560" data-duration="1.48" data-track-index="1" style="top:924px">Ha scelto un mestiere che vende aria</div>
    <div class="cap clip" id="cap98-1" data-start="337.000" data-duration="1.02" data-track-index="1" style="top:924px"><b class="k" id="cap98-1-w0">fresca.</b></div>
    <div class="cap clip" id="cap99-0" data-start="338.020" data-duration="1.56" data-track-index="1" style="top:924px">Un mestiere che nessuno nota,</div>
    <div class="cap clip" id="cap99-1" data-start="339.540" data-duration="1.48" data-track-index="1" style="top:924px">finché funziona.</div>
    <div class="cap clip" id="cap100-0" data-start="341.020" data-duration="0.52" data-track-index="1" style="top:924px">E in cambio,</div>
    <div class="cap clip" id="cap100-1" data-start="341.500" data-duration="2.3" data-track-index="1" style="top:924px">paga con il <b class="k" id="cap100-1-w3">caldo.</b></div>
    <div class="cap clip" id="cap101-0" data-start="343.800" data-duration="1.44" data-track-index="1" style="top:924px">Se questo video ti è piaciuto,</div>
    <div class="cap clip" id="cap101-1" data-start="345.200" data-duration="1.02" data-track-index="1" style="top:924px"><b class="k" id="cap101-1-w0">iscriviti</b> al canale.</div>
    <div class="cap clip" id="cap102-0" data-start="346.220" data-duration="2.54" data-track-index="1" style="top:924px">E scrivi nei <b class="k" id="cap102-0-w3">commenti:</b> lavori nel</div>
    <div class="cap clip" id="cap102-1" data-start="348.720" data-duration="2.44" data-track-index="1" style="top:924px">settore? A che <b class="k" id="cap102-1-w3">livello</b> sei?</div>
